<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semáforo del Agua</title>
<style>
  :root {
    --rojo: #e63946;
    --amarillo: #f4c430;
    --verde: #2a9d5c;
    --bg: #14181f;
    --card: #1e242e;
    --text: #f2f2f2;
    --muted: #9aa4b2;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app {
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }
  #selectScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    gap: 18px;
    text-align: center;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(255,255,255,0.06), transparent 55%),
      radial-gradient(ellipse at 85% 85%, rgba(255,255,255,0.05), transparent 50%),
      linear-gradient(160deg, #0b2f4a 0%, #0e4a6b 45%, #127a8c 100%);
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px 0;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 20px 0;
    font-size: 0.95rem;
    max-width: 320px;
  }
  .btn {
    width: 100%;
    max-width: 340px;
    padding: 18px;
    border: none;
    border-radius: 16px;
    font-size: 0.95rem;
    font-weight: 700;
    line-height: 1.35;
    color: #14181f;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: left;
  }
  .btn.rojo { background: var(--rojo); color: #fff; }
  .btn.amarillo { background: var(--amarillo); }
  .btn.verde { background: var(--verde); color: #fff; }

  #colorScreen {
    display: none;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 40px;
  }
  #colorScreen.rojo { background: var(--rojo); }
  #colorScreen.amarillo { background: var(--amarillo); }
  #colorScreen.verde { background: var(--verde); }
  #label {
    font-size: 1.3rem;
    font-weight: 800;
    color: rgba(0,0,0,0.55);
    margin-bottom: 18px;
    letter-spacing: 0.5px;
  }
  #resetBtn {
    background: rgba(0,0,0,0.18);
    color: rgba(0,0,0,0.7);
    border: none;
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <div id="selectScreen">
    <h1>💧 Semáforo de Decisiones</h1>
    <p class="sub">Elige un color y levanta tu celular para mostrarlo.</p>
    <button class="btn verde" onclick="pick('verde','FAVORABLE')">🟢 Acción favorable para conservar el ciclo del agua</button>
    <button class="btn amarillo" onclick="pick('amarillo','RIESGO')">🟡 Acción que puede generar una alteración o riesgo si se mantiene</button>
    <button class="btn rojo" onclick="pick('rojo','ALTERA EL CICLO')">🔴 Acción que altera significativamente el ciclo hidrológico o contribuye a superar el límite planetario</button>
  </div>
  <div id="colorScreen">
    <div id="label"></div>
    <button id="resetBtn" onclick="reset()">↺ Elegir de nuevo</button>
  </div>
</div>
<script>
  function pick(color, text) {
    document.getElementById('selectScreen').style.display = 'none';
    var cs = document.getElementById('colorScreen');
    cs.className = color;
    cs.style.display = 'flex';
    document.getElementById('label').textContent = text;
  }
  function reset() {
    document.getElementById('colorScreen').style.display = 'none';
    document.getElementById('selectScreen').style.display = 'flex';
  }
</script>
</body>
</html>
